<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<style>
:root{--bg:#eef1f5;--surface:#fff;--ink:#131a26;--muted:#5b6676;--line:#d5dbe4;--accent:#1f4fd8}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141c;--surface:#19212d;--ink:#e9eef5;--muted:#97a3b5;--line:#2b3647;--accent:#7598ff}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:12px}
h1{margin:0 0 4px;font-size:28px}
a.app{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
a.app img{width:56px;height:56px;border-radius:12px}
a.app strong{display:block;font-size:18px}
a.app span{color:var(--muted);font-size:14px}
p{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <!-- Une entrée par application : un dossier à la racine, avec son index.html. -->
  <a class="app" href="suivi-muscu/">
    <img src="suivi-muscu/apple-touch-icon.png" alt="">
    <div><strong>Suivi Muscu 5 jours</strong><span>Suivi des séances et chrono de repos</span></div>
  </a>
  <p>Sur iPhone : ouvre l'app dans Safari, puis Partager, Sur l'écran d'accueil.</p>
</main>
</body>
</html>
